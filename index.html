<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVENTHUB - Inter-College Event Discovery & Management</title>
    <meta name="description" content="Inter-college event discovery, registration, networking, attendance, certificate, and event-management platform." />
    <meta property="og:title" content="EVENTHUB - Inter-College Event Discovery & Management" />
    <meta property="og:description" content="Inter-college event discovery, registration, networking, attendance, certificate, and event-management platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='18' rx='2' ry='2'%3E%3C/rect%3E%3Cline x1='16' y1='2' x2='16' y2='6'%3E%3C/line%3E%3Cline x1='8' y1='2' x2='8' y2='6'%3E%3C/line%3E%3Cline x1='3' y1='10' x2='21' y2='10'%3E%3C/line%3E%3Cpolygon points='12 14 13.5 17 17 17.5 14.5 20 15 23.5 12 21.8 9 23.5 9.5 20 7 17.5 10.5 17 12 14'%3E%3C/polygon%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: sans-serif; padding: 2rem; text-align: center;">
        <h2>JavaScript is required to run EVENTHUB.</h2>
        <p>Please enable JavaScript in your browser settings to continue.</p>
      </div>
    </noscript>
    <script>
      // When opened directly as a file (e.g. double-clicking index.html), direct user to active web browser server
      if (window.location.protocol === 'file:') {
        var browserUrl = 'http://localhost:3000';
        document.addEventListener('DOMContentLoaded', function() {
          var rootEl = document.getElementById('root');
          if (rootEl && !rootEl.children.length) {
            rootEl.innerHTML = '<div style="font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#fff;padding:24px;box-sizing:border-box;">' +
              '<div style="max-width:540px;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:32px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);text-align:center;">' +
                '<div style="width:64px;height:64px;background:#2563eb;color:#fff;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;margin:0 auto 20px;">EH</div>' +
                '<h1 style="font-size:24px;font-weight:bold;margin:0 0 12px;color:#f8fafc;">Directing to EVENTHUB Web Browser</h1>' +
                '<p style="color:#94a3b8;font-size:15px;line-height:1.6;margin:0 0 24px;">EVENTHUB is running at <strong>' + browserUrl + '</strong>. Directing your web browser now...</p>' +
                '<a id="direct-btn" href="' + browserUrl + '" style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 28px;border-radius:10px;font-size:15px;">Open in Web Browser (' + browserUrl + ')</a>' +
                '<p style="color:#64748b;font-size:13px;margin:24px 0 0;">If your local development server is not running yet, execute <code style="background:#0f172a;padding:3px 8px;border-radius:6px;color:#38bdf8;">npm run dev</code> in your project terminal.</p>' +
              '</div>' +
            '</div>';
          }
        });
        window.location.href = browserUrl;
      }
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
